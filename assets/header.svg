<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
<title id="t">Jeevan V</title>
<desc id="d">Senior data and AI engineer working on GenAI, vector search and text-to-SQL. An animated workflow graph shows data moving from ingestion through Spark and Temporal into Cassandra, Neo4j and a group of AI agents.</desc>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#141C3A"/>
  </pattern>
  <radialGradient id="halo" cx="0.76" cy="0.45" r="0.45">
    <stop offset="0" stop-color="#9D7BFF" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#9D7BFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scan" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#2EF2C8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#2EF2C8" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#2EF2C8" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="c0"><rect x="96" y="270" height="30" width="0"><animate id="t0" attributeName="width" begin="0s;t6.end" dur="4.4s" values="0;364.8;364.8;0" keyTimes="0;0.4;0.86;1" fill="remove"/></rect></clipPath><clipPath id="c1"><rect x="96" y="270" height="30" width="0"><animate id="t1" attributeName="width" begin="t0.end" dur="4.4s" values="0;410.4;410.4;0" keyTimes="0;0.4;0.86;1" fill="remove"/></rect></clipPath><clipPath id="c2"><rect x="96" y="270" height="30" width="0"><animate id="t2" attributeName="width" begin="t1.end" dur="4.4s" values="0;376.2;376.2;0" keyTimes="0;0.4;0.86;1" fill="remove"/></rect></clipPath><clipPath id="c3"><rect x="96" y="270" height="30" width="0"><animate id="t3" attributeName="width" begin="t2.end" dur="4.4s" values="0;330.6;330.6;0" keyTimes="0;0.4;0.86;1" fill="remove"/></rect></clipPath><clipPath id="c4"><rect x="96" y="270" height="30" width="0"><animate id="t4" attributeName="width" begin="t3.end" dur="4.4s" values="0;399.0;399.0;0" keyTimes="0;0.4;0.86;1" fill="remove"/></rect></clipPath><clipPath id="c5"><rect x="96" y="270" height="30" width="0"><animate id="t5" attributeName="width" begin="t4.end" dur="4.4s" values="0;467.4;467.4;0" keyTimes="0;0.4;0.86;1" fill="remove"/></rect></clipPath><clipPath id="c6"><rect x="96" y="270" height="30" width="0"><animate id="t6" attributeName="width" begin="t5.end" dur="4.4s" values="0;387.6;387.6;0" keyTimes="0;0.4;0.86;1" fill="remove"/></rect></clipPath>
</defs>
<style>
  .wire { fill:none; stroke:#1E2A55; stroke-width:1.5; }
  .flow { fill:none; stroke:#2EF2C8; stroke-width:1.2; stroke-opacity:.45;
          stroke-dasharray:3 11; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:-28; } }
  .ring { stroke-width:1.2; opacity:0; transform-box:fill-box; transform-origin:center;
          animation: ring 3.2s ease-out infinite; }
  @keyframes ring { 0% { opacity:.7; transform:scale(1); } 70%,100% { opacity:0; transform:scale(1.7); } }
  .core { animation: core 3.2s ease-in-out infinite; }
  @keyframes core { 0%,100% { opacity:.45; } 20% { opacity:1; } }
  .nlabel { font:500 12px 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill:#8C98C8; text-anchor:middle; }
  .prompt { font:500 15px 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill:#2EF2C8; }
  .name { font:700 66px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif; fill:#EAF0FF; letter-spacing:-1.5px; }
  .role { font:400 22px 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Arial,sans-serif; fill:#8C98C8; }
  .typed { font:500 19px 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill:#2EF2C8; }
  .caret { fill:#FFB54A; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .status { font:500 13px 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; fill:#5A6694; }
  .live { fill:#2EF2C8; animation: core 1.6s ease-in-out infinite; }
  .sweep { animation: sweep 7s linear infinite; }
  @keyframes sweep { from { transform:translateY(-140px); } to { transform:translateY(560px); } }
  
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

</style>

