<text x="96" y="292" class="typed" textLength="364.8" lengthAdjust="spacingAndGlyphs" clip-path="url(#c0)">building GenAI apps on real data</text><text x="96" y="292" class="typed" textLength="410.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#c1)">turning questions into SQL with LLMs</text><text x="96" y="292" class="typed" textLength="376.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#c2)">grounding LLMs with vector search</text><text x="96" y="292" class="typed" textLength="330.6" lengthAdjust="spacingAndGlyphs" clip-path="url(#c3)">wiring multi-agent AI systems</text><text x="96" y="292" class="typed" textLength="399.0" lengthAdjust="spacingAndGlyphs" clip-path="url(#c4)">orchestrating distributed pipelines</text><text x="96" y="292" class="typed" textLength="467.4" lengthAdjust="spacingAndGlyphs" clip-path="url(#c5)">writing about Python for data engineering</text><text x="96" y="292" class="typed" textLength="387.6" lengthAdjust="spacingAndGlyphs" clip-path="url(#c6)">painting when the builds are green</text>
